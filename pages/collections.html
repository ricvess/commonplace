<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collections — COMMONPLACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/collections.css" />
  <link rel="stylesheet" href="../css/polish.css" />
</head>
<body class="dash-body">

  <div class="dash-shell">

    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="dash-sidebar" id="dash-sidebar">
      <div class="sidebar-top">
        <a href="../index.html" class="logo">
          <svg class="logo-mark" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L22 12L12 22L2 12L12 2Z" fill="currentColor"/>
          </svg>
          <span>COMMONPLACE</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <span class="nav-group-label">Library</span>
          <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12l9-9 9 9M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Overview</span>
          </a>
          <a href="items.html" class="nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
            <span>All Items</span>
            <span class="nav-badge" id="nav-count-items">0</span>
          </a>
          <!-- Active state untuk Collections -->
          <a href="collections.html" class="nav-item active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h6l2 2h10v10H3V7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Collections</span>
          </a>
          <a href="favorites.html" class="nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Favorites</span>
          </a>
                    <a href="explore.html" class="nav-item">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M12 3l1.9 5.8L20 10.7l-4.9 4.8 1.2 6.8-6.3-3.3-6.3 3.3 1.2-6.8L3 10.7l6.1-1.9L12 3z" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span>Explore</span>
</a>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">Account</span>
          <a href="settings.html" class="nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Settings</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">R</div>
        <div class="user-info">
          <span class="user-name" id="user-name">Guest</span>
          <span class="user-email" id="user-email">guest@commonplace.app</span>
        </div>
        <button class="logout-btn" id="logout-btn" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <!-- ═══════════ MAIN ═══════════ -->
    <main class="dash-main">
      <header class="dash-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
        </button>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
          <input type="search" id="search-input" placeholder="Search collections..." autocomplete="off" />
        </div>
        <button class="btn btn-primary btn-add" id="open-collection-modal">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
          <span>New Collection</span>
        </button>
      </header>

      <div class="dash-content">
        <div class="items-header reveal">
          <div>
            <h1 class="page-title">Collections</h1>
            <p class="page-desc">Group your inspirations into folders.</p>
          </div>
        </div>

        <!-- Collections Grid -->
        <div class="collections-grid" id="collections-grid">
          <!-- Diisi oleh JS -->
        </div>
      </div>
    </main>
  </div>

  <!-- ═══════════ MODAL (Collection) ═══════════ -->
  <div class="modal-overlay" id="collection-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modal-title">New Collection</h3>
        <button class="modal-close" id="close-modal" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
        </button>
      </div>

      <form id="collection-form" class="modal-form">
        <input type="hidden" id="edit-collection-id" value="" />
        
        <div class="field">
          <label for="collection-name">Collection Name</label>
          <input type="text" id="collection-name" placeholder="e.g. Design Inspiration" required />
        </div>
        
        <div class="field">
          <label for="collection-desc">Description <span class="optional">(optional)</span></label>
          <textarea id="collection-desc" rows="3" placeholder="What is this collection about?"></textarea>
        </div>

        <label class="checkbox">
          <input type="checkbox" id="collection-public" />
          <span class="checkbox-mark"></span>
          <span class="checkbox-label">Make this collection public (shareable link)</span>
        </label>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <span class="btn-text">Create Collection</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/collections.js"></script>
</body>
</html>
