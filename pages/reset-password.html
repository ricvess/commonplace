<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — COMMONPLACE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 10 L90 50 L50 90 L10 50 Z' fill='%23899681'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="login-wrapper">
    <div class="glass-card">
      <div class="login-header">
        <a href="../index.html" class="logo">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L22 12L12 22L2 12L12 2Z" fill="currentColor"/></svg>
          <span>COMMONPLACE</span>
        </a>
        <h1 class="login-title">Set new <em>password.</em></h1>
        <p class="login-desc">Please enter your new password below.</p>
      </div>

      <form id="update-pass-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <div class="input-wrap">
            <input type="password" id="new-password" class="form-input" placeholder="At least 8 characters" required />
            <button type="button" class="toggle-password" id="toggle-password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="error-msg" id="pass-error">Password must be at least 8 characters.</div>
        </div>

        <button type="submit" class="submit-btn" id="update-btn">
          <span class="btn-text">Update Password</span>
          <div class="spinner"></div>
        </button>
      </form>
      
      <div class="login-footer" id="success-message" style="display:none; color: #5A7248; font-weight: 600;">
        Password updated successfully! Redirecting to login...
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '../js/supabase.js';

    const form = document.getElementById('update-pass-form');
    const passInput = document.getElementById('new-password');
    const btn = document.getElementById('update-btn');
    const errorMsg = document.getElementById('pass-error');
    const successMsg = document.getElementById('success-message');

    // Toggle Mata (Copy dari login.js)
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = toggleBtn.querySelector('svg');
    toggleBtn.addEventListener('click', () => {
      const isHidden = passInput.type === 'password';
      passInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke-linecap="round" stroke-linejoin="round"/><line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round" stroke-linejoin="round"/>` : `<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>`;
    });

    // Submit Password Baru
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (passInput.value.length < 8) {
        errorMsg.style.display = 'block';
        return;
      }

      btn.classList.add('loading');

      const { error } = await supabase.auth.updateUser({
        password: passInput.value
      });

      btn.classList.remove('loading');

      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.style.display = 'block';
      } else {
        form.style.display = 'none';
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = 'login.html'; }, 2500);
      }
    });
  </script>
</body>
</html>
