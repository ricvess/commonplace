<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore — COMMONPLACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/explore.css" />
  <link rel="stylesheet" href="../css/polish.css" />
</head>
<body class="dash-body">

  <div class="dash-shell">

    <!-- SIDEBAR -->
    <aside class="dash-sidebar" id="dash-sidebar">
      <div class="sidebar-top">
        <a href="../index.html" class="logo">
          <svg class="logo-mark" viewBox="0 0 24 24" fill="none"><path d="M12 2L22 12L12 22L2 12L12 2Z" fill="currentColor"/></svg>
          <span>COMMONPLACE</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <span class="nav-group-label">Library</span>
          <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12l9-9 9 9M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Overview</span></a>
          <a href="items.html" class="nav-item"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg><span>All Items</span></a>
          <a href="collections.html" class="nav-item"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h6l2 2h10v10H3V7z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Collections</span></a>
          <a href="favorites.html" class="nav-item"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Favorites</span></a>
          <a href="explore.html" class="nav-item active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l1.9 5.8L20 10.7l-4.9 4.8 1.2 6.8-6.3-3.3-6.3 3.3 1.2-6.8L3 10.7l6.1-1.9L12 3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Explore</span>
          </a>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">Account</span>
          <a href="settings.html" class="nav-item"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Settings</span></a>
        </div>
      </nav>
      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">R</div>
        <div class="user-info"><span class="user-name" id="user-name">Guest</span><span class="user-email" id="user-email">guest@</span></div>
        <button class="logout-btn" id="logout-btn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="dash-main">
      <header class="dash-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
        </button>
        <div class="search-wrap">
          <input type="search" id="search-input" placeholder="Search quotes..." autocomplete="off" />
        </div>
        <button class="btn btn-primary btn-add" id="refresh-quotes">
          Refresh Quotes
        </button>
      </header>

      <div class="dash-content">
        <!-- QOTD -->
        <section class="qotd-section">
          <span class="eyebrow" style="color:var(--sage)"><span class="eyebrow-dot"></span>Quote of the Day</span>
          <blockquote class="qotd-quote" id="qotd-quote">Memuat quote...</blockquote>
          <div class="qotd-author" id="qotd-author">—</div>
          <button class="btn qotd-save" id="qotd-save" disabled>Save to Library</button>
        </section>

        <!-- Grid Quotes -->
        <div class="explore-header">
          <h2>More inspiration</h2>
          <p>Quotes curated from around the web. Save what resonates.</p>
        </div>
        <div class="quotes-grid" id="quotes-grid"></div>
      </div>
    </main>
  </div>

  <script type="module" src="../js/explore.js"></script>
</body>
</html>
